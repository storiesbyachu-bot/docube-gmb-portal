<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docube — My Bookings</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.ph-hero{background:var(--navy);padding:44px 20px;position:relative;overflow:hidden}
.ph-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 80% 0%,rgba(77,217,217,.15) 0%,transparent 55%)}
.ph-hero-inner{position:relative;z-index:1;max-width:680px;margin:0 auto}
.ph-hero h1{font-family:'Instrument Serif',serif;font-size:clamp(26px,4vw,38px);color:#fff;margin-bottom:8px}
.ph-hero p{font-size:13.5px;color:rgba(255,255,255,.5);font-weight:300;margin-bottom:22px}
.ph-search-box{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:var(--r-sm);padding:6px 6px 6px 16px;display:flex;gap:8px;align-items:center}
.ph-search-box input{flex:1;background:transparent;border:none;color:#fff;font-family:inherit;font-size:14px;outline:none;padding:8px 0}
.ph-search-box input::placeholder{color:rgba(255,255,255,.4)}
.ph-body{max-width:680px;margin:0 auto;padding:22px 20px 80px}
.ph-empty{text-align:center;padding:56px 20px;color:var(--text-muted)}
.ph-empty svg{width:44px;height:44px;color:var(--border);margin-bottom:12px}
.ph-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.ph-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.ph-doc-name{font-size:15px;font-weight:700;color:var(--navy)}
.ph-doc-spec{font-size:12px;color:var(--text-muted);margin-top:2px}
.ph-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.ph-meta-item{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-mid)}
.ph-meta-item svg{width:13px;height:13px;color:var(--teal-dark)}
.ph-reason{font-size:12.5px;color:var(--text-muted);font-style:italic;margin-bottom:12px;padding:8px 12px;background:var(--cream);border-radius:6px;border-left:3px solid var(--border)}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border-light)}
.ph-actions .btn{padding:8px 18px;font-size:13px}
.badge-rescheduled{background:rgba(77,217,217,.15);color:var(--teal-dark);border:1px solid rgba(77,217,217,.3)}

/* Reschedule modal */
.modal-overlay{position:fixed;inset:0;background:rgba(11,31,53,.55);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--r);padding:28px;max-width:500px;width:100%;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;position:relative}
.modal-title{font-family:'Instrument Serif',serif;font-size:22px;color:var(--navy);margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:16px;background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:15px;color:var(--text-muted);font-family:inherit;line-height:1}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:4px 12px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--text-mid);transition:all .15s}
.cal-nav-btn:hover{border-color:var(--teal-dark);color:var(--teal-dark)}
.cal-month{font-size:13.5px;font-weight:700;color:var(--text)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.cal-head .dh{font-size:9.5px;font-weight:700;color:var(--text-muted);text-align:center;padding:2px 0;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.date-btn{padding:7px 2px;text-align:center;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;border:1.5px solid transparent;background:var(--cream);color:var(--text);transition:all .13s;width:100%}
.date-btn:hover:not([disabled]){border-color:var(--teal-dark);background:var(--teal-pale)}
.date-btn.selected{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:700}
.date-btn.today{border-color:var(--teal);color:var(--teal-dark);font-weight:700}
.date-btn[disabled]{opacity:.3;cursor:not-allowed}
.date-btn.empty{background:transparent;border:none;cursor:default}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;margin-top:10px}
.slot-btn{padding:8px 4px;text-align:center;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:500;background:#fff;color:var(--text);transition:all .13s}
.slot-btn:hover:not(.unavail){border-color:var(--teal-dark);background:var(--teal-pale)}
.slot-btn.selected{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);font-weight:700}
.slot-btn.unavail{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.rs-hint{font-size:12px;color:var(--text-muted);margin-top:8px}
@media(max-width:560px){.ph-card{padding:16px}}
</style>
</head>
<body>

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg"></span>
</div>

<!-- Reschedule Modal -->
<div class="modal-overlay" id="rsModal">
  <div class="modal">
    <button class="modal-close" onclick="closeRsModal()">✕</button>
    <div class="modal-title">Reschedule</div>
    <div class="modal-sub" id="rsModalSub"></div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="rsChangeMonth(-1)">← Prev</button>
      <div class="cal-month" id="rsCalMonth"></div>
      <button class="cal-nav-btn" onclick="rsChangeMonth(1)">Next →</button>
    </div>
    <div class="cal-head" id="rsCalHead"></div>
    <div class="cal-grid" id="rsCalGrid"></div>
    <div id="rsSlotWrap" style="margin-top:16px;display:none">
      <div style="font-size:12px;font-weight:700;color:var(--text-mid);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px" id="rsSlotDateLbl"></div>
      <p class="rs-hint" id="rsSlotLoading" style="display:none">Checking availability…</p>
      <div class="slot-grid" id="rsSlotGrid"></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-light)">
      <button class="btn btn-ghost" onclick="closeRsModal()">Cancel</button>
      <button class="btn btn-orange" id="rsConfirmBtn" onclick="confirmReschedule()" disabled>Confirm Reschedule</button>
    </div>
  </div>
</div>

<nav class="topnav">
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 44 22" fill="none">
      <polyline points="0,11 5,11 7.5,4 10,18 12.5,7 15,14 18,11 22,11" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="25" y1="3" x2="25" y2="19" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="29" y1="1" x2="29" y2="21" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="33" y1="4" x2="33" y2="18" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="37" y1="7" x2="37" y2="15" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="41" y1="9" x2="41" y2="13" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="nav-logo-text"><b>DOC</b>UBE</span>
  </a>
  <div class="nav-spacer"></div>
  <a class="nav-btn nav-btn-ghost" href="index.html">Our Doctors</a>
</nav>

<div class="ph-hero">
  <div class="ph-hero-inner">
    <h1>My Bookings</h1>
    <p>View, cancel or reschedule your consultations</p>
    <div class="ph-search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.32h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.5a16 16 0 0 0 6 6l.94-.94a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/></svg>
      <input type="tel" id="ph_phone" placeholder="Enter your mobile number…" onkeydown="if(event.key==='Enter')loadHistory()">
      <button class="btn btn-orange" style="padding:9px 20px;font-size:13px" onclick="loadHistory()">Search</button>
    </div>
  </div>
</div>

<div class="ph-body fadein">
  <div id="phContent">
    <div class="ph-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <p>Enter your mobile number above to view your bookings</p>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

async function loadHistory() {
  const phone = document.getElementById('ph_phone').value.trim();
  if (!phone) { toast('Enter your mobile number', 'error'); return; }
  const content = document.getElementById('phContent');
  content.innerHTML = '<div class="ph-empty"><div style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div><p>Loading your bookings…</p></div>';
  try {
    const bookings = await sbGet('bookings', `select=*&patient_phone=eq.${encodeURIComponent(phone)}&order=preferred_date.desc,preferred_time.desc`);
    if (!bookings.length) {
      content.innerHTML = '<div class="ph-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><p>No bookings found for this number.</p></div>';
      return;
    }
    renderBookings(bookings);
  } catch(e) {
    content.innerHTML = '<div class="ph-empty"><p>Could not load bookings. Please try again.</p></div>';
  }
}

function renderBookings(bookings) {
  const content = document.getElementById('phContent');
  const upcoming = bookings.filter(b => b.status !== 'cancelled');
  const cancelled = bookings.filter(b => b.status === 'cancelled');
  let html = '';
  if (upcoming.length) {
    html += `<div style="font-size:12px;font-weight:700;color:var(--text-mid);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px">Upcoming & Recent</div>`;
    html += upcoming.map(b => bookingCard(b)).join('');
  }
  if (cancelled.length) {
    html += `<div style="font-size:12px;font-weight:700;color:var(--text-mid);letter-spacing:.06em;text-transform:uppercase;margin:20px 0 12px">Cancelled</div>`;
    html += cancelled.map(b => bookingCard(b)).join('');
  }
  content.innerHTML = html;
}

function bookingCard(b) {
  const canAct = b.status !== 'cancelled';
  const d = new Date(b.preferred_date + 'T00:00:00');
  return `<div class="ph-card">
    <div class="ph-card-head">
      <div>
        <div class="ph-doc-name">${b.doctor_name}</div>
        <div class="ph-doc-spec">${(b.docube_center || '').replace('Docube Healthcare – ', 'Docube ')}</div>
      </div>
      <span class="badge badge-${b.status}">${b.status}</span>
    </div>
    <div class="ph-meta">
      <div class="ph-meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>${d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' })}</span>
      </div>
      <div class="ph-meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>${formatTime(b.preferred_time)}</span>
      </div>
    </div>
    ${b.reason ? `<div class="ph-reason">"${b.reason}"</div>` : ''}
    ${canAct ? `<div class="ph-actions">
      <button class="btn btn-ghost" onclick="openReschedule('${b.id}','${b.doctor_id}','${b.doctor_name}','${b.preferred_date}','${b.preferred_time}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Reschedule
      </button>
      <button class="btn btn-ghost" style="color:var(--error);border-color:rgba(224,82,82,.3)" onclick="cancelBooking('${b.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Cancel
      </button>
    </div>` : ''}
  </div>`;
}

async function cancelBooking(id) {
  if (!confirm('Are you sure you want to cancel this booking?')) return;
  try {
    await sbPatch('bookings', `id=eq.${id}`, { status: 'cancelled' });
    toast('Booking cancelled.');
    loadHistory();
  } catch(e) { toast('Could not cancel. Try again.', 'error'); }
}

// ── RESCHEDULE ──
let rsBookingId, rsDocId, rsDocHours, rsCalYear, rsCalMonth, rsSelectedDate, rsSelectedTime;

async function openReschedule(bookingId, docId, docName, currentDate, currentTime) {
  rsBookingId = bookingId; rsDocId = docId;
  rsSelectedDate = null; rsSelectedTime = null;
  document.getElementById('rsModalSub').textContent = `Rescheduling with ${docName} (currently ${currentDate} at ${formatTime(currentTime)})`;
  document.getElementById('rsSlotWrap').style.display = 'none';
  document.getElementById('rsConfirmBtn').disabled = true;
  const now = new Date(); rsCalYear = now.getFullYear(); rsCalMonth = now.getMonth();
  try {
    const docs = await sbGet('doctor_profiles', `id=eq.${docId}&select=consultation_hours`);
    rsDocHours = docs[0]?.consultation_hours || [];
  } catch(e) { rsDocHours = []; }
  buildRsCalendar();
  document.getElementById('rsModal').classList.add('show');
}

function closeRsModal() { document.getElementById('rsModal').classList.remove('show'); }

function rsChangeMonth(dir) {
  rsCalMonth += dir;
  if (rsCalMonth > 11) { rsCalMonth = 0; rsCalYear++; }
  if (rsCalMonth < 0) { rsCalMonth = 11; rsCalYear--; }
  buildRsCalendar();
}

function buildRsCalendar() {
  const dn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('rsCalHead').innerHTML = dn.map(d => `<div class="dh">${d}</div>`).join('');
  document.getElementById('rsCalMonth').textContent = new Date(rsCalYear, rsCalMonth, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(rsCalYear, rsCalMonth, 1).getDay();
  const dim = new Date(rsCalYear, rsCalMonth + 1, 0).getDate();
  const closedSet = new Set((rsDocHours || []).filter(h => h.closed).map(h => h.day));
  let html = '';
  for (let i = 0; i < firstDay; i++) html += `<button class="date-btn empty" disabled></button>`;
  for (let d = 1; d <= dim; d++) {
    const date = new Date(rsCalYear, rsCalMonth, d);
    const dayName = DAY_NAMES[date.getDay()];
    const isPast = date < today;
    const isClosed = closedSet.has(dayName);
    const isToday = date.toDateString() === today.toDateString();
    const ds = `${rsCalYear}-${String(rsCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = (isPast || isClosed) ? 'disabled' : (rsSelectedDate === ds ? 'selected' : (isToday ? 'today' : ''));
    html += `<button class="date-btn ${cls}" onclick="rsSelectDate('${ds}','${dayName}',this)" ${(isPast || isClosed) ? 'disabled' : ''}>${d}</button>`;
  }
  document.getElementById('rsCalGrid').innerHTML = html;
}

async function rsSelectDate(ds, dayName, btn) {
  document.querySelectorAll('#rsCalGrid .date-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  rsSelectedDate = ds; rsSelectedTime = null;
  document.getElementById('rsConfirmBtn').disabled = true;
  const dh = (rsDocHours || []).find(h => h.day === dayName);
  const wrap = document.getElementById('rsSlotWrap');
  document.getElementById('rsSlotDateLbl').textContent = new Date(ds + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  wrap.style.display = 'block';
  document.getElementById('rsSlotLoading').style.display = 'block';
  document.getElementById('rsSlotGrid').innerHTML = '';
  let bookedTimes = [];
  try {
    const ex = await sbGet('bookings', `select=preferred_time&doctor_id=eq.${rsDocId}&preferred_date=eq.${ds}&status=neq.cancelled&id=neq.${rsBookingId}`);
    bookedTimes = ex.map(b => b.preferred_time);
  } catch(e) {}
  document.getElementById('rsSlotLoading').style.display = 'none';
  const slots = genSlots(dh?.open || '09:00', dh?.close || '17:00');
  document.getElementById('rsSlotGrid').innerHTML = slots.map(t => {
    const bk = bookedTimes.includes(t);
    return `<button class="slot-btn${bk ? ' unavail' : ''}" ${bk ? 'disabled' : `onclick="rsSelectSlot('${t}',this)"`}>${formatTime(t)}</button>`;
  }).join('');
}

function rsSelectSlot(t, btn) {
  document.querySelectorAll('#rsSlotGrid .slot-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  rsSelectedTime = t;
  document.getElementById('rsConfirmBtn').disabled = false;
}

async function confirmReschedule() {
  if (!rsSelectedDate || !rsSelectedTime) return;
  const btn = document.getElementById('rsConfirmBtn');
  btn.textContent = 'Saving…'; btn.disabled = true;
  try {
    await sbPatch('bookings', `id=eq.${rsBookingId}`, { preferred_date: rsSelectedDate, preferred_time: rsSelectedTime, status: 'rescheduled' });
    toast('Booking rescheduled!');
    closeRsModal();
    loadHistory();
  } catch(e) {
    toast('Could not reschedule. Try again.', 'error');
    btn.textContent = 'Confirm Reschedule'; btn.disabled = false;
  }
}

function genSlots(open, close) {
  const s = []; let [oh, om] = open.split(':').map(Number);
  const [ch, cm] = close.split(':').map(Number);
  const cMin = ch * 60 + cm;
  while (oh * 60 + om < cMin) {
    s.push(`${String(oh).padStart(2,'0')}:${String(om).padStart(2,'0')}`);
    om += 30; if (om >= 60) { oh++; om -= 60; }
  }
  return s;
}

// Auto-load if phone in URL
const urlPhone = new URLSearchParams(location.search).get('phone');
if (urlPhone) { document.getElementById('ph_phone').value = urlPhone; loadHistory(); }
</script>
</body>
</html>
