<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docube — Doctor Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.prof-hero{background:var(--navy);position:relative;overflow:hidden;padding:44px 20px 0}
.prof-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 100% at 90% 0%,rgba(77,217,217,.15) 0%,transparent 55%),radial-gradient(ellipse 40% 60% at 0% 100%,rgba(245,166,35,.1) 0%,transparent 50%)}
.prof-hero-inner{position:relative;z-index:1;max-width:860px;margin:0 auto;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.prof-avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--teal-pale),rgba(77,217,217,.4));border:3px solid var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Instrument Serif',serif;font-size:36px;color:var(--navy)}
.prof-info{padding-bottom:22px;flex:1;min-width:180px}
.prof-spec-tag{display:inline-block;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.3);color:var(--orange);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.prof-name{font-family:'Instrument Serif',serif;font-size:clamp(24px,4vw,36px);color:#fff;line-height:1.1;margin-bottom:6px}
.prof-quals{font-size:13px;color:rgba(255,255,255,.5);font-weight:300}
.prof-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pmeta-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:rgba(255,255,255,.6);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 10px}
.pmeta-item svg{width:13px;height:13px;color:var(--teal)}
.prof-body{max-width:860px;margin:0 auto;padding:22px 20px 80px;display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start}
@media(max-width:720px){.prof-body{grid-template-columns:1fr}}
.prof-sec{background:#fff;border:1px solid var(--border-light);border-radius:var(--r);padding:24px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.prof-sec-t{font-size:12.5px;font-weight:700;color:var(--text-mid);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.prof-sec-t::after{content:'';flex:1;height:1px;background:var(--border-light)}
.srv-tags{display:flex;flex-wrap:wrap;gap:7px}
.srv-tag{background:var(--teal-pale);border:1px solid var(--border);border-radius:6px;padding:4px 11px;font-size:12px;color:var(--text-mid)}
.hours-tbl{width:100%;border-collapse:collapse}
.hours-tbl tr td{padding:6px 0;font-size:13px;border-bottom:1px solid var(--border-light)}
.hours-tbl tr:last-child td{border-bottom:none}
.hours-tbl .dc{color:var(--text-mid);font-weight:600;width:90px}
.closed-badge{background:#fff1f1;color:#e05252;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px}
.book-card{background:var(--navy);border-radius:var(--r);padding:26px;box-shadow:var(--shadow-lg);position:sticky;top:76px}
.book-card-title{font-family:'Instrument Serif',serif;font-size:20px;color:#fff;margin-bottom:3px}
.book-card-sub{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:20px}
.fee-row{display:flex;align-items:center;justify-content:space-between;background:rgba(77,217,217,.1);border:1px solid rgba(77,217,217,.2);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:16px}
.fee-label{font-size:12px;color:rgba(255,255,255,.5)}
.fee-val{font-size:16px;font-weight:700;color:var(--teal)}
.contact-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.contact-row svg{width:14px;height:14px;color:var(--teal);flex-shrink:0}
.contact-row a{font-size:12.5px;color:rgba(255,255,255,.6);text-decoration:none}
.contact-row a:hover{color:var(--teal)}
.prof-share{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 13px;margin-top:14px;cursor:pointer;transition:all .16s}
.prof-share:hover{background:rgba(255,255,255,.1)}
.prof-share-txt{font-size:12px;color:rgba(255,255,255,.6);flex:1}
.prof-share svg{width:14px;height:14px;color:var(--teal)}
.not-found{text-align:center;padding:80px 20px;color:var(--text-muted)}
.not-found h2{font-family:'Instrument Serif',serif;font-size:28px;color:var(--navy);margin-bottom:10px}
@media(max-width:560px){.prof-hero-inner{flex-direction:column;align-items:flex-start}.book-card{position:static}}
</style>
</head>
<body>

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg">Done</span>
</div>

<nav class="topnav">
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 44 22" fill="none">
      <polyline points="0,11 5,11 7.5,4 10,18 12.5,7 15,14 18,11 22,11" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="25" y1="3" x2="25" y2="19" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="29" y1="1" x2="29" y2="21" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="33" y1="4" x2="33" y2="18" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="37" y1="7" x2="37" y2="15" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="41" y1="9" x2="41" y2="13" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="nav-logo-text"><b>DOC</b>UBE</span>
  </a>
  <div class="nav-spacer"></div>
  <a class="nav-btn nav-btn-ghost" href="index.html">Our Doctors</a>
  <a class="nav-btn nav-btn-admin" href="admin.html">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Admin
  </a>
  <a class="nav-btn nav-btn-orange" href="onboard.html">GMB Onboarding</a>
</nav>

<div id="profileContent"></div>

<script src="shared.js"></script>
<script>
async function loadProfile() {
  const params = new URLSearchParams(location.search);
  const id = params.get('doctor');
  if (!id) { location.href = 'index.html'; return; }

  // Check if logged-in doctor owns this profile
  let loggedInDoctor = null;
  try { loggedInDoctor = JSON.parse(localStorage.getItem('docube_doctor')); } catch(e) {}
  const isOwner = loggedInDoctor && loggedInDoctor.id === id;

  try {
    const docs = await sbGet('doctor_profiles', `select=*&id=eq.${id}`);
    if (!docs.length) {
      document.getElementById('profileContent').innerHTML = `
        <div class="not-found fadein">
          <h2>Doctor not found</h2>
          <p>This profile may have been removed.</p>
          <a href="index.html" class="btn btn-orange" style="margin-top:20px;display:inline-flex">← Back to Doctors</a>
        </div>`;
      return;
    }
    const d = docs[0];
    document.title = `Docube — ${d.full_name}`;
    renderProfile(d, isOwner);
  } catch(e) {
    document.getElementById('profileContent').innerHTML = '<div class="not-found"><p>Could not load profile.</p></div>';
  }
}

function renderProfile(d, isOwner = false) {
  // Parse JSON-stringified fields
  const tryParse = (val, fallback) => {
    if (!val) return fallback;
    if (typeof val === 'object') return val;
    try { return JSON.parse(val); } catch(e) { return fallback; }
  };
  d.consultation_hours = tryParse(d.consultation_hours, []);
  d.services           = tryParse(d.services, []);
  d.languages          = tryParse(d.languages, []);
  d.docube_centers     = tryParse(d.docube_centers, d.docube_center ? [d.docube_center] : []);

  const centers = getCenters(d);

  const metaHTML = [
    centers.length ? `<span class="pmeta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${centers.map(c=>c.replace('Docube Healthcare – ','Docube ')).join(' · ')}</span>` : '',
    d.appointment_type ? `<span class="pmeta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${d.appointment_type}</span>` : '',
    d.fee_range ? `<span class="pmeta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>${d.fee_range}</span>` : '',
    `<span class="badge badge-${d.gmb_status === 'live' ? 'live' : 'pending'}">${d.gmb_status === 'live' ? 'GMB Live' : 'GMB Pending'}</span>`,
  ].filter(Boolean).join('');

  const hoursHTML = d.consultation_hours.map(h =>
    `<tr><td class="dc">${h.day.slice(0,3)}</td><td>${h.closed ? '<span class="closed-badge">Closed</span>' : `${h.open} – ${h.close}`}</td></tr>`
  ).join('');

  // GMB section — only show if data exists
  const gmbInfoHTML = (d.gmb_full_name || d.gmb_qualifications || d.gmb_experience || d.gmb_speciality || d.gmb_home_visits || d.gmb_service_area || d.existing_gmb || d.gmb_existing_link) ? `
    <div class="prof-sec">
      <div class="prof-sec-t">GMB Profile Details</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        ${d.gmb_full_name ? `<tr><td style="color:var(--text-muted);padding:5px 0;width:140px;font-weight:600">Name on Google</td><td style="padding:5px 0;color:var(--text)">${d.gmb_full_name}</td></tr>` : ''}
        ${d.gmb_qualifications ? `<tr><td style="color:var(--text-muted);padding:5px 0;font-weight:600">Qualifications</td><td style="padding:5px 0;color:var(--text)">${d.gmb_qualifications}</td></tr>` : ''}
        ${d.gmb_experience ? `<tr><td style="color:var(--text-muted);padding:5px 0;font-weight:600">Experience</td><td style="padding:5px 0;color:var(--text)">${d.gmb_experience}</td></tr>` : ''}
        ${d.gmb_speciality ? `<tr><td style="color:var(--text-muted);padding:5px 0;font-weight:600">GMB Speciality</td><td style="padding:5px 0;color:var(--text)">${d.gmb_speciality}</td></tr>` : ''}
        ${d.gmb_home_visits ? `<tr><td style="color:var(--text-muted);padding:5px 0;font-weight:600">Home Visits</td><td style="padding:5px 0;color:var(--text)">${d.gmb_home_visits}</td></tr>` : ''}
        ${d.gmb_service_area ? `<tr><td style="color:var(--text-muted);padding:5px 0;font-weight:600">Service Area</td><td style="padding:5px 0;color:var(--text)">${d.gmb_service_area}</td></tr>` : ''}
        ${d.existing_gmb ? `<tr><td style="color:var(--text-muted);padding:5px 0;font-weight:600">Existing GMB</td><td style="padding:5px 0;color:var(--text)">${d.existing_gmb}</td></tr>` : ''}
        ${d.gmb_existing_link ? `<tr><td style="color:var(--text-muted);padding:5px 0;font-weight:600">GMB Link</td><td style="padding:5px 0"><a href="${d.gmb_existing_link}" target="_blank" style="color:var(--teal-dark);word-break:break-all">${d.gmb_existing_link}</a></td></tr>` : ''}
        ${d.gmb_access_confirmed ? `<tr><td style="color:var(--text-muted);padding:5px 0;font-weight:600">Access</td><td style="padding:5px 0;color:var(--text)">${d.gmb_access_confirmed === 'done' ? '✓ Access already given' : 'Will give access after submission'}</td></tr>` : ''}
      </table>
    </div>` : '';

  const notesHTML = d.notes ? `
    <div class="prof-sec">
      <div class="prof-sec-t">Notes for Docube Team</div>
      <p style="font-size:13.5px;color:var(--text-mid);line-height:1.65">${d.notes}</p>
    </div>` : '';

  document.getElementById('profileContent').innerHTML = `
    <div class="prof-hero fadein">
      <div class="prof-hero-inner">
        <div class="prof-avatar">${initials(d.full_name)}</div>
        <div class="prof-info">
          <div class="prof-spec-tag">${d.speciality}</div>
          <div class="prof-name">${d.full_name}</div>
          <div class="prof-quals">${d.qualifications} · ${d.experience}</div>
          <div class="prof-meta">${metaHTML}</div>
        </div>
      </div>
      ${isOwner ? `<div style="position:relative;z-index:1;max-width:860px;margin:16px auto 0;padding:0 20px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="display:inline-flex;align-items:center;gap:7px;background:rgba(77,217,217,.15);border:1px solid rgba(77,217,217,.3);border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--teal)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          You're viewing your own profile
        </div>
        <a href="doctor-dash.html" style="display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:600;text-decoration:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="13" height="13"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit Profile
        </a>
        <a href="doctor-dash.html" onclick="localStorage.setItem('docube_dash_tab','gmb')" style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.2)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Request GMB Change
        </a>
      </div>` : ''}
    </div>
    <div class="prof-body fadein">
      <div>
        ${d.bio ? `<div class="prof-sec"><div class="prof-sec-t">About</div><p style="font-size:14px;color:var(--text-mid);line-height:1.7">${d.bio}</p></div>` : ''}

        <div class="prof-sec">
          <div class="prof-sec-t">Services & Conditions</div>
          <div class="srv-tags">${d.services.map(s=>`<span class="srv-tag">${s}</span>`).join('') || '<span style="color:var(--text-muted);font-size:13px">Not specified</span>'}</div>
        </div>

        <div class="prof-sec">
          <div class="prof-sec-t">Consultation Hours</div>
          <table class="hours-tbl">${hoursHTML}</table>
        </div>

        <div class="prof-sec">
          <div class="prof-sec-t">Languages</div>
          <div class="srv-tags">${d.languages.map(l=>`<span class="srv-tag">${l}</span>`).join('') || '—'}</div>
        </div>

        ${isOwner ? gmbInfoHTML : ''}
        ${isOwner ? notesHTML : ''}
      </div>
      <div>
        ${isOwner ? `
        <div style="background:#fff;border:1px solid var(--border-light);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-sm);margin-bottom:16px">
          <div style="font-size:12px;font-weight:700;color:var(--text-mid);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px">Your Profile</div>
          <a href="doctor-dash.html" class="btn btn-teal" style="width:100%;justify-content:center;margin-bottom:8px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit My Profile
          </a>
          <a href="doctor-dash.html#gmb" class="btn btn-ghost" style="width:100%;justify-content:center;font-size:13px" onclick="localStorage.setItem('docube_dash_tab','gmb')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            Request GMB Change
          </a>
        </div>` : ''}
        <div class="book-card">
          <div class="book-card-title">Book Consultation</div>
          ${centers.length > 1 ? `
          <div style="margin-bottom:14px">
            <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">Select Center</div>
            <div style="display:flex;flex-direction:column;gap:6px" id="centerPicker">
              ${centers.map((c,i) => `
                <label style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(255,255,255,.06);border:1.5px solid ${i===0?'rgba(77,217,217,.4)':'rgba(255,255,255,.1)'};border-radius:8px;cursor:pointer" onclick="pickCenter(this,'${c}')">
                  <input type="radio" name="bookCenter" value="${c}" ${i===0?'checked':''} style="display:none">
                  <span style="width:14px;height:14px;border-radius:50%;border:2px solid ${i===0?'var(--teal)':'rgba(255,255,255,.3)'};display:flex;align-items:center;justify-content:center;flex-shrink:0" class="center-radio-dot">${i===0?'<span style="width:6px;height:6px;border-radius:50%;background:var(--teal);display:block"></span>':''}</span>
                  <span style="font-size:12.5px;color:rgba(255,255,255,.8)">${c.replace('Docube Healthcare – ','')}</span>
                </label>`).join('')}
            </div>
          </div>` : `<div class="book-card-sub" style="margin-bottom:14px">${centers[0]?.replace('Docube Healthcare – ','Docube ') || 'Docube Healthcare'}</div>`}
          <div class="fee-row"><span class="fee-label">Consultation Fee</span><span class="fee-val">${d.fee_range || '—'}</span></div>
          <a href="booking.html?doctor=${d.id}" id="bookBtn" class="btn btn-orange btn-lg" style="width:100%;justify-content:center">Book Appointment →</a>
          ${d.clinic_phone || d.phone ? `<div class="contact-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.32h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.5a16 16 0 0 0 6 6l.94-.94a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/></svg><a href="tel:${d.clinic_phone||d.phone}">${d.clinic_phone||d.phone}</a></div>` : ''}
          ${d.whatsapp ? `<div class="contact-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><a href="https://wa.me/${d.whatsapp.replace(/\D/g,'')}" target="_blank">${d.whatsapp}</a></div>` : ''}
          ${d.email ? `<div class="contact-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><a href="mailto:${d.email}">${d.email}</a></div>` : ''}
          <div class="prof-share" onclick="shareProfile()">
            <span class="prof-share-txt">Share doctor profile link</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </div>
        </div>
      </div>
    </div>`;
}

function getCenters(d) {
  if (d.docube_centers && d.docube_centers.length) return d.docube_centers;
  if (d.docube_center) return [d.docube_center];
  return [];
}

function pickCenter(el, center) {
  // Update radio styles
  document.querySelectorAll('#centerPicker label').forEach(l => {
    l.style.borderColor = 'rgba(255,255,255,.1)';
    l.querySelector('.center-radio-dot').innerHTML = '';
    l.querySelector('.center-radio-dot').style.borderColor = 'rgba(255,255,255,.3)';
  });
  el.style.borderColor = 'rgba(77,217,217,.4)';
  el.querySelector('.center-radio-dot').innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:var(--teal);display:block"></span>';
  el.querySelector('.center-radio-dot').style.borderColor = 'var(--teal)';
  el.querySelector('input').checked = true;
  // Update book link
  const docId = new URLSearchParams(location.search).get('doctor');
  document.getElementById('bookBtn').href = `booking.html?doctor=${docId}&center=${encodeURIComponent(center)}`;
}

function shareProfile() {
  navigator.clipboard.writeText(location.href).then(() => toast('Profile link copied!')).catch(() => toast('Copy: ' + location.href));
}

loadProfile();
</script>
</body>
</html>
