<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docube — Book a Consultation</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.bk-hero{background:var(--navy);padding:40px 20px 36px;position:relative;overflow:hidden}
.bk-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 100% at 100% 0%,rgba(245,166,35,.15) 0%,transparent 50%)}
.bk-hero-inner{position:relative;z-index:1;max-width:680px;margin:0 auto}
.bk-doc-row{display:flex;align-items:center;gap:13px;margin-bottom:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);padding:13px 16px}
.bk-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,rgba(77,217,217,.4),rgba(77,217,217,.2));border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:18px;color:var(--navy);flex-shrink:0}
.bk-doc-name{font-size:15px;font-weight:700;color:#fff}
.bk-doc-spec{font-size:12px;color:rgba(255,255,255,.5)}
.bk-hero h2{font-family:'Instrument Serif',serif;font-size:clamp(22px,4vw,32px);color:#fff;margin-bottom:7px}
.bk-hero p{font-size:13.5px;color:rgba(255,255,255,.5);font-weight:300}
.bk-body{max-width:680px;margin:0 auto;padding:0 20px 80px}
.bk-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--r);padding:28px;margin-top:20px;box-shadow:var(--shadow-sm)}
.bk-sec-t{font-size:12px;font-weight:700;color:var(--text-mid);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:5px 13px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text-mid);transition:all .15s}
.cal-nav-btn:hover{border-color:var(--teal-dark);color:var(--teal-dark)}
.cal-month{font-size:14px;font-weight:700;color:var(--text)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-head .dh{font-size:10px;font-weight:700;color:var(--text-muted);text-align:center;padding:3px 0;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.date-btn{padding:8px 3px;text-align:center;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;border:1.5px solid transparent;background:var(--cream);color:var(--text);transition:all .14s;width:100%}
.date-btn:hover:not([disabled]){border-color:var(--teal-dark);background:var(--teal-pale)}
.date-btn.selected{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:700}
.date-btn.today{border-color:var(--teal);color:var(--teal-dark);font-weight:700}
.date-btn[disabled]{opacity:.3;cursor:not-allowed}
.date-btn.empty{background:transparent;border:none;cursor:default}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px;margin-top:12px}
.slot-btn{padding:9px 5px;text-align:center;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;background:#fff;color:var(--text);transition:all .14s;line-height:1.3}
.slot-btn:hover:not(.unavail){border-color:var(--teal-dark);background:var(--teal-pale)}
.slot-btn.selected{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);font-weight:700}
.slot-btn.unavail{opacity:.32;cursor:not-allowed;text-decoration:line-through;background:var(--cream)}
.bk-summary{display:flex;flex-wrap:wrap;gap:9px;background:var(--teal-pale);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 15px;margin-bottom:20px}
.bk-sum-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-mid)}
.bk-sum-item svg{width:13px;height:13px;color:var(--teal-dark)}
.bk-sum-item span{font-weight:600;color:var(--text)}
.slot-hint{font-size:12.5px;color:var(--text-muted);padding:20px 0;text-align:center}
.fee-note{display:inline-flex;align-items:center;gap:5px;background:var(--orange-pale);border:1px solid rgba(245,166,35,.25);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--orange-dark);font-weight:600}
@media(max-width:560px){.bk-card{padding:20px 16px}}
</style>
</head>
<body>

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg"></span>
</div>

<nav class="topnav">
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 44 22" fill="none">
      <polyline points="0,11 5,11 7.5,4 10,18 12.5,7 15,14 18,11 22,11" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="25" y1="3" x2="25" y2="19" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="29" y1="1" x2="29" y2="21" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="33" y1="4" x2="33" y2="18" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="37" y1="7" x2="37" y2="15" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="41" y1="9" x2="41" y2="13" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="nav-logo-text"><b>DOC</b>UBE</span>
  </a>
  <div class="nav-spacer"></div>
  <a class="nav-btn nav-btn-ghost" href="index.html">Our Doctors</a>
  <a class="nav-btn nav-btn-ghost" href="patient-history.html">My Bookings</a>
</nav>

<!-- Hero — populated by JS -->
<div class="bk-hero">
  <div class="bk-hero-inner">
    <div class="bk-doc-row">
      <div class="bk-avatar" id="bkAvatar">D</div>
      <div>
        <div class="bk-doc-name" id="bkDocName">Loading…</div>
        <div class="bk-doc-spec" id="bkDocSpec"></div>
      </div>
    </div>
    <h2>Book Your Consultation</h2>
    <p>Select a date and time — booking is instant</p>
  </div>
</div>

<div class="bk-body fadein">

  <!-- Calendar -->
  <div class="bk-card">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">← Prev</button>
      <div class="cal-month" id="calMonth"></div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">Next →</button>
    </div>
    <div class="cal-head" id="calHead"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- Time slots -->
  <div class="bk-card" id="slotCard" style="display:none">
    <div class="bk-sec-t">
      <span>Select Time</span>
      <span id="slotDateLbl" style="font-size:13px;color:var(--text);text-transform:none;letter-spacing:0;font-weight:600"></span>
    </div>
    <p class="slot-hint" id="slotLoading" style="display:none">Checking availability…</p>
    <div class="slot-grid" id="slotGrid"></div>
  </div>

  <!-- Patient details -->
  <div class="bk-card" id="patientCard" style="display:none">
    <div class="bk-sec-t">Your Details</div>
    <div class="bk-summary" id="bkSummary"></div>
    <div class="fg">
      <div class="f">
        <label class="lbl">Full Name <span class="req">*</span></label>
        <input type="text" id="bk_name" placeholder="Your full name">
        <span class="f-err" id="be_name">Enter your name</span>
      </div>
      <div class="f">
        <label class="lbl">Mobile <span class="req">*</span></label>
        <input type="tel" id="bk_phone" placeholder="+91 98765 43210">
        <span class="f-hint">We'll use this for booking history</span>
        <span class="f-err" id="be_phone">Enter valid number</span>
      </div>
      <div class="f">
        <label class="lbl">Email <span class="opt">(optional)</span></label>
        <input type="email" id="bk_email" placeholder="you@example.com">
      </div>
      <div class="f">
        <label class="lbl">Age <span class="opt">(optional)</span></label>
        <input type="text" id="bk_age" placeholder="e.g. 34">
      </div>
      <div class="f span2">
        <label class="lbl">Gender</label>
        <div class="pills" id="genderPills" style="margin-top:4px">
          <label class="pill on" onclick="pickPill(this,'genderPills')"><input type="radio" name="gender" value="Male" checked>Male</label>
          <label class="pill" onclick="pickPill(this,'genderPills')"><input type="radio" name="gender" value="Female">Female</label>
          <label class="pill" onclick="pickPill(this,'genderPills')"><input type="radio" name="gender" value="Other">Other</label>
        </div>
      </div>
      <div class="f span2">
        <label class="lbl">Reason for Visit <span class="opt">(optional)</span></label>
        <textarea id="bk_reason" rows="2" placeholder="Briefly describe your concern…"></textarea>
      </div>
    </div>
    <div class="form-nav">
      <span></span>
      <button class="btn btn-teal btn-lg" id="bkSubmitBtn" onclick="submitBooking()">
        <span id="bkSubmitTxt">Confirm Booking</span>
        <div class="spinner" id="bkSpinner"></div>
        <svg id="bkSubmitIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="15" height="15"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Success -->
  <div class="success-card" id="bkSuccess">
    <div class="success-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-h">Booking Confirmed!</div>
    <p class="success-p" id="bkSuccessMsg"></p>
    <a class="success-cta" href="patient-history.html">View My Bookings →</a>
  </div>

</div>

<script src="shared.js"></script>
<script>
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let doc = null, selectedDate = null, selectedTime = null, calYear, calMonth;

async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('doctor');
  const selectedCenter = decodeURIComponent(params.get('center') || '');
  if (!id) { location.href = 'index.html'; return; }
  try {
    const docs = await sbGet('doctor_profiles', `select=*&id=eq.${id}`);
    if (!docs.length) { location.href = 'index.html'; return; }
    doc = docs[0];
    // Use selected center or fall back to first
    const centers = doc.docube_centers?.length ? doc.docube_centers : [doc.docube_center].filter(Boolean);
    doc._selectedCenter = selectedCenter || centers[0] || '';
    document.title = `Book — ${doc.full_name}`;
    document.getElementById('bkAvatar').textContent = initials(doc.full_name);
    document.getElementById('bkDocName').textContent = doc.full_name;
    document.getElementById('bkDocSpec').textContent = `${doc.speciality} · ${doc._selectedCenter.replace('Docube Healthcare – ', 'Docube ')}`;
    const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth();
    buildCalendar();
  } catch(e) {
    toast('Could not load doctor details.', 'error');
  }
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  buildCalendar();
}

function buildCalendar() {
  const dn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('calHead').innerHTML = dn.map(d => `<div class="dh">${d}</div>`).join('');
  document.getElementById('calMonth').textContent = new Date(calYear, calMonth, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const dim = new Date(calYear, calMonth + 1, 0).getDate();
  const hours = doc?.consultation_hours || [];
  const closedSet = new Set(hours.filter(h => h.closed).map(h => h.day));
  let html = '';
  for (let i = 0; i < firstDay; i++) html += `<button class="date-btn empty" disabled></button>`;
  for (let d = 1; d <= dim; d++) {
    const date = new Date(calYear, calMonth, d);
    const dayName = DAY_NAMES[date.getDay()];
    const isPast = date < today;
    const isClosed = closedSet.has(dayName);
    const isToday = date.toDateString() === today.toDateString();
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = (isPast || isClosed) ? 'disabled' : (selectedDate === ds ? 'selected' : (isToday ? 'today' : ''));
    html += `<button class="date-btn ${cls}" onclick="selectDate('${ds}','${dayName}',this)" ${(isPast || isClosed) ? 'disabled' : ''}>${d}</button>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

async function selectDate(ds, dayName, btn) {
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDate = ds; selectedTime = null;
  const hours = doc?.consultation_hours || [];
  const dh = hours.find(h => h.day === dayName);
  const slotCard = document.getElementById('slotCard');
  document.getElementById('slotDateLbl').textContent = new Date(ds + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  slotCard.style.display = 'block';
  document.getElementById('patientCard').style.display = 'none';
  document.getElementById('slotLoading').style.display = 'block';
  document.getElementById('slotGrid').innerHTML = '';
  let bookedTimes = [];
  try {
    const ex = await sbGet('bookings', `select=preferred_time&doctor_id=eq.${doc.id}&preferred_date=eq.${ds}&status=neq.cancelled`);
    bookedTimes = ex.map(b => b.preferred_time);
  } catch(e) {}
  document.getElementById('slotLoading').style.display = 'none';
  const slots = genSlots(dh?.open || '09:00', dh?.close || '17:00');
  if (!slots.length) {
    document.getElementById('slotGrid').innerHTML = '<p class="slot-hint">No slots available for this day.</p>';
    slotCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  document.getElementById('slotGrid').innerHTML = slots.map(t => {
    const bk = bookedTimes.includes(t);
    return `<button class="slot-btn${bk ? ' unavail' : ''}" ${bk ? 'disabled' : `onclick="selectTime('${t}',this)"`}>
      ${formatTime(t)}${bk ? '<br><span style="font-size:9px;opacity:.7">Booked</span>' : ''}
    </button>`;
  }).join('');
  slotCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function genSlots(open, close) {
  const s = []; let [oh, om] = open.split(':').map(Number);
  const [ch, cm] = close.split(':').map(Number);
  const cMin = ch * 60 + cm;
  while (oh * 60 + om < cMin) {
    s.push(`${String(oh).padStart(2,'0')}:${String(om).padStart(2,'0')}`);
    om += 30; if (om >= 60) { oh++; om -= 60; }
  }
  return s;
}

function selectTime(time, btn) {
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected'); selectedTime = time;
  const d = new Date(selectedDate + 'T00:00:00');
  document.getElementById('bkSummary').innerHTML = `
    <div class="bk-sum-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>${doc.full_name}</span></div>
    <div class="bk-sum-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>${d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })}</span></div>
    <div class="bk-sum-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>${formatTime(selectedTime)}</span></div>
    ${doc.fee_range ? `<div class="bk-sum-item"><span class="fee-note">${doc.fee_range}</span></div>` : ''}
    <div class="bk-sum-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>${doc._selectedCenter.replace('Docube Healthcare – ','')}</span></div>`;
  document.getElementById('patientCard').style.display = 'block';
  document.getElementById('patientCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function pickPill(el, groupId) {
  document.querySelectorAll(`#${groupId} .pill`).forEach(p => p.classList.remove('on'));
  el.classList.add('on');
}

function vF(id, errId, fn) {
  const el = document.getElementById(id);
  const ok = fn(el ? el.value : '');
  if (el) el.classList.toggle('err', !ok);
  document.getElementById(errId)?.classList.toggle('show', !ok);
  return ok;
}

async function submitBooking() {
  if (!selectedDate || !selectedTime) { toast('Please select a date and time.', 'error'); return; }
  let ok = true;
  ok &= vF('bk_name', 'be_name', v => v.trim().length > 1);
  ok &= vF('bk_phone', 'be_phone', v => /^[+0-9\s\-]{7,}$/.test(v));
  if (!ok) return;
  const btn = document.getElementById('bkSubmitBtn');
  document.getElementById('bkSubmitTxt').textContent = 'Checking…';
  document.getElementById('bkSpinner').style.display = 'block';
  document.getElementById('bkSubmitIcon').style.display = 'none';
  btn.disabled = true;
  try {
    // Double-booking check
    const ex = await sbGet('bookings', `select=id&doctor_id=eq.${doc.id}&preferred_date=eq.${selectedDate}&preferred_time=eq.${selectedTime}&status=neq.cancelled`);
    if (ex.length > 0) {
      toast('This slot was just booked. Please pick another time.', 'error');
      document.getElementById('bkSubmitTxt').textContent = 'Confirm Booking';
      document.getElementById('bkSpinner').style.display = 'none';
      document.getElementById('bkSubmitIcon').style.display = 'block';
      btn.disabled = false;
      // Refresh slots
      selectDate(selectedDate, DAY_NAMES[new Date(selectedDate + 'T00:00:00').getDay()], document.querySelector('.date-btn.selected'));
      return;
    }
    const data = {
      doctor_id: doc.id,
      doctor_name: doc.full_name,
      docube_center: doc._selectedCenter || doc.docube_center,
      patient_name: document.getElementById('bk_name').value.trim(),
      patient_phone: document.getElementById('bk_phone').value.trim(),
      patient_email: document.getElementById('bk_email').value.trim(),
      patient_age: document.getElementById('bk_age').value.trim(),
      patient_gender: document.querySelector('input[name="gender"]:checked')?.value,
      preferred_date: selectedDate,
      preferred_time: selectedTime,
      reason: document.getElementById('bk_reason').value.trim(),
      status: 'confirmed'
    };
    await sbPost('bookings', data);
    const d = new Date(selectedDate + 'T00:00:00');
    document.getElementById('bkSuccessMsg').innerHTML = `Your consultation with <strong>${doc.full_name}</strong> on <strong>${d.toLocaleDateString('en-IN', { day:'numeric', month:'long' })} at ${formatTime(selectedTime)}</strong> is confirmed. See you at <strong>${doc._selectedCenter.replace('Docube Healthcare – ','Docube ')}</strong>!`;
    document.getElementById('bkSuccess').classList.add('show');
    document.getElementById('bkSuccess').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('slotCard').style.display = 'none';
    document.getElementById('patientCard').style.display = 'none';
  } catch(e) {
    toast('Booking failed. Please try again.', 'error');
    document.getElementById('bkSubmitTxt').textContent = 'Confirm Booking';
    document.getElementById('bkSpinner').style.display = 'none';
    document.getElementById('bkSubmitIcon').style.display = 'block';
    btn.disabled = false;
  }
}

init();
</script>
</body>
</html>
