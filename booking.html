<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docube — Book Appointment</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.bk-hero{background:var(--navy);padding:42px 20px 38px;position:relative;overflow:hidden}
.bk-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 100% at 100% 0%,rgba(245,166,35,.15) 0%,transparent 50%)}
.bk-hero-inner{position:relative;z-index:1;max-width:700px;margin:0 auto}
.bk-doc-row{display:flex;align-items:center;gap:13px;margin-bottom:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm);padding:13px 16px}
.bk-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,rgba(77,217,217,.4),rgba(77,217,217,.2));border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:17px;color:var(--navy);flex-shrink:0}
.bk-doc-name{font-size:14.5px;font-weight:700;color:#fff}
.bk-doc-spec{font-size:11.5px;color:rgba(255,255,255,.45)}
.bk-hero h2{font-family:'Instrument Serif',serif;font-size:clamp(22px,4vw,32px);color:#fff;margin-bottom:7px}
.bk-hero p{font-size:13.5px;color:rgba(255,255,255,.45);font-weight:300}
.bk-body{max-width:700px;margin:0 auto;padding:0 20px 80px}
.bk-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--r);padding:28px;margin-top:20px;box-shadow:var(--shadow-sm)}
.bk-sec-t{font-size:12.5px;font-weight:700;color:var(--text-mid);letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px;padding-bottom:11px;border-bottom:1px solid var(--border-light)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text-mid);transition:all .15s}
.cal-nav-btn:hover{border-color:var(--teal-dark);color:var(--teal-dark)}
.cal-month{font-size:14px;font-weight:700;color:var(--text)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:2px}
.cal-head .dh{font-size:10px;font-weight:700;color:var(--text-muted);text-align:center;padding:3px 0;letter-spacing:.05em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.date-btn{padding:8px 3px;text-align:center;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;border:1.5px solid transparent;background:var(--cream);color:var(--text);transition:all .15s;width:100%}
.date-btn:hover:not([disabled]){border-color:var(--teal-dark);background:var(--teal-pale)}
.date-btn.selected{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:700}
.date-btn.today{border-color:var(--teal);color:var(--teal-dark);font-weight:700}
.date-btn[disabled]{opacity:.3;cursor:not-allowed}
.date-btn.empty{background:transparent;border:none;cursor:default}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;margin-top:12px}
.slot-btn{padding:9px 5px;text-align:center;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;background:#fff;color:var(--text);transition:all .15s}
.slot-btn:hover:not(.unavail){border-color:var(--teal-dark);background:var(--teal-pale)}
.slot-btn.selected{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);font-weight:700}
.slot-btn.unavail{opacity:.35;cursor:not-allowed;text-decoration:line-through;background:var(--cream)}
.bk-summary{display:flex;flex-wrap:wrap;gap:9px;background:var(--teal-pale);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:20px}
.bk-sum-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-mid)}
.bk-sum-item svg{width:13px;height:13px;color:var(--teal-dark)}
.bk-sum-item span{font-weight:600;color:var(--text)}
</style>
</head>
<body>

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg">Done</span>
</div>

<nav class="topnav">
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 44 22" fill="none">
      <polyline points="0,11 5,11 7.5,4 10,18 12.5,7 15,14 18,11 22,11" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="25" y1="3" x2="25" y2="19" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="29" y1="1" x2="29" y2="21" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="33" y1="4" x2="33" y2="18" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="37" y1="7" x2="37" y2="15" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="41" y1="9" x2="41" y2="13" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="nav-logo-text"><b>DOC</b>UBE</span>
  </a>
  <div class="nav-spacer"></div>
  <a class="nav-btn nav-btn-ghost" href="index.html">Our Doctors</a>
  <a class="nav-btn nav-btn-admin" href="admin.html">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Admin
  </a>
  <a class="nav-btn nav-btn-orange" href="onboard.html">GMB Onboarding</a>
</nav>

<div id="heroWrap"></div>
<div class="bk-body fadein">
  <div class="bk-card" id="calCard">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">← Prev</button>
      <div class="cal-month" id="calMonth"></div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">Next →</button>
    </div>
    <div class="cal-head" id="calHead"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="bk-card" id="slotCard" style="display:none">
    <div class="bk-sec-t">Select Time — <span id="slotDateLbl" style="color:var(--text);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600"></span></div>
    <p class="f-hint" id="slotLoading" style="display:none">Checking availability…</p>
    <div class="slot-grid" id="slotGrid"></div>
  </div>

  <div class="bk-card" id="patientCard" style="display:none">
    <div class="bk-sec-t">Your Details</div>
    <div class="bk-summary" id="bkSummary"></div>
    <div class="fg">
      <div class="f"><label class="lbl">Full Name <span class="req">*</span></label><input type="text" id="bk_name" placeholder="Your full name"><span class="f-err" id="be_name">Enter your name</span></div>
      <div class="f"><label class="lbl">Mobile <span class="req">*</span></label><input type="tel" id="bk_phone" placeholder="+91 98765 43210"><span class="f-err" id="be_phone">Enter valid number</span></div>
      <div class="f"><label class="lbl">Email <span class="opt">(optional)</span></label><input type="email" id="bk_email" placeholder="you@example.com"></div>
      <div class="f"><label class="lbl">Age <span class="opt">(optional)</span></label><input type="text" id="bk_age" placeholder="e.g. 34"></div>
      <div class="f span2">
        <label class="lbl">Gender</label>
        <div class="pills" id="genderPills" style="margin-top:2px">
          <label class="pill on" onclick="pickPill(this,'genderPills')"><input type="radio" name="gender" value="Male" checked>Male</label>
          <label class="pill" onclick="pickPill(this,'genderPills')"><input type="radio" name="gender" value="Female">Female</label>
          <label class="pill" onclick="pickPill(this,'genderPills')"><input type="radio" name="gender" value="Other">Other</label>
        </div>
      </div>
      <div class="f span2"><label class="lbl">Reason for Visit <span class="opt">(optional)</span></label><textarea id="bk_reason" rows="2" placeholder="Briefly describe your concern…"></textarea></div>
    </div>
    <div class="form-nav"><span></span>
      <button class="btn btn-teal btn-lg" id="bkSubmitBtn" onclick="submitBooking()">
        <span id="bkSubmitTxt">Confirm Booking</span>
        <div class="spinner" id="bkSpinner"></div>
        <svg id="bkSubmitIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="15" height="15"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
  </div>

  <div class="success-card" id="bkSuccess">
    <div class="success-ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="success-h">Booking Confirmed!</div>
    <p class="success-p" id="bkSuccessMsg"></p>
    <a class="success-cta" href="index.html">Back to Doctors →</a>
  </div>
</div>

<script src="shared.js"></script>
<script>
let currentDoc = null;
let selectedDate = null, selectedTime = null;
let calYear, calMonth;

function pickPill(el, groupId) {
  document.querySelectorAll(`#${groupId} .pill`).forEach(p => p.classList.remove('on'));
  el.classList.add('on');
}

async function loadBooking() {
  const params = new URLSearchParams(location.search);
  const id = params.get('doctor');
  if (!id) { location.href = 'index.html'; return; }
  try {
    const docs = await sbGet('doctor_profiles', `select=*&id=eq.${id}`);
    if (!docs.length) { location.href = 'index.html'; return; }
    currentDoc = docs[0];
    document.title = `Book — ${currentDoc.full_name}`;
    renderHero();
    const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth();
    buildCalendar();
  } catch(e) {
    document.getElementById('heroWrap').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted)">Could not load booking page.</div>';
  }
}

function renderHero() {
  document.getElementById('heroWrap').innerHTML = `
    <div class="bk-hero fadein">
      <div class="bk-hero-inner">
        <div class="bk-doc-row">
          <div class="bk-avatar">${initials(currentDoc.full_name)}</div>
          <div>
            <div class="bk-doc-name">${currentDoc.full_name}</div>
            <div class="bk-doc-spec">${currentDoc.speciality} · ${(currentDoc.docube_center || '').replace('Docube Healthcare – ','Docube ')}</div>
          </div>
        </div>
        <h2>Book Your Consultation</h2>
        <p>Select a date and time — we'll confirm within 2 hours</p>
      </div>
    </div>`;
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  buildCalendar();
}

function buildCalendar() {
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('calHead').innerHTML = dayNames.map(d => `<div class="dh">${d}</div>`).join('');
  document.getElementById('calMonth').textContent = new Date(calYear, calMonth, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const hours = currentDoc?.consultation_hours || [];
  const dayIndexMap = {0:'Sunday',1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',5:'Friday',6:'Saturday'};
  const closedSet = new Set(hours.filter(h => h.closed).map(h => h.day));
  let html = '';
  for (let i = 0; i < firstDay; i++) html += `<button class="date-btn empty" disabled></button>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(calYear, calMonth, d);
    const dayName = dayIndexMap[date.getDay()];
    const isPast = date < today;
    const isClosed = closedSet.has(dayName);
    const isToday = date.toDateString() === today.toDateString();
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = (isPast || isClosed) ? 'disabled' : (selectedDate === dateStr ? 'selected' : (isToday ? 'today' : ''));
    html += `<button class="date-btn ${cls}" onclick="selectDate('${dateStr}','${dayName}',this)" ${(isPast || isClosed) ? 'disabled' : ''}>${d}</button>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

async function selectDate(dateStr, dayName, btn) {
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDate = dateStr; selectedTime = null;
  const hours = currentDoc?.consultation_hours || [];
  const dayHours = hours.find(h => h.day === dayName);
  const slotCard = document.getElementById('slotCard');
  const slotGrid = document.getElementById('slotGrid');
  const d = new Date(dateStr + 'T00:00:00');
  document.getElementById('slotDateLbl').textContent = d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  slotCard.style.display = 'block';
  document.getElementById('patientCard').style.display = 'none';
  document.getElementById('slotLoading').style.display = 'block';
  slotGrid.innerHTML = '';
  let bookedTimes = [];
  try {
    const existing = await sbGet('bookings', `select=preferred_time&doctor_id=eq.${currentDoc.id}&preferred_date=eq.${dateStr}&status=neq.cancelled`);
    bookedTimes = existing.map(b => b.preferred_time);
  } catch(e) {}
  document.getElementById('slotLoading').style.display = 'none';
  const slots = generateSlots(dayHours?.open || '09:00', dayHours?.close || '17:00');
  slotGrid.innerHTML = slots.map(t => {
    const booked = bookedTimes.includes(t);
    return `<button class="slot-btn${booked ? ' unavail' : ''}" ${booked ? 'disabled' : `onclick="selectTime('${t}',this)"`} title="${booked ? 'Already booked' : ''}">${formatTime(t)}${booked ? '<br><span style="font-size:9px;opacity:.7">Booked</span>' : ''}</button>`;
  }).join('');
  slotCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function generateSlots(open, close) {
  const slots = []; let [oh, om] = open.split(':').map(Number);
  const [ch, cm] = close.split(':').map(Number);
  const closeMin = ch * 60 + cm;
  while (oh * 60 + om < closeMin) {
    slots.push(`${String(oh).padStart(2,'0')}:${String(om).padStart(2,'0')}`);
    om += 30; if (om >= 60) { oh++; om -= 60; }
  }
  return slots;
}

function selectTime(time, btn) {
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected'); selectedTime = time;
  const d = new Date(selectedDate + 'T00:00:00');
  document.getElementById('bkSummary').innerHTML = `
    <div class="bk-sum-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>${d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span></div>
    <div class="bk-sum-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>${formatTime(selectedTime)}</span></div>
    <div class="bk-sum-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>${currentDoc?.full_name}</span></div>`;
  document.getElementById('patientCard').style.display = 'block';
  document.getElementById('patientCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function vF(id, errId, fn) {
  const el = document.getElementById(id);
  const ok = fn(el ? el.value : '');
  if (el) el.classList.toggle('err', !ok);
  if (errId) document.getElementById(errId)?.classList.toggle('show', !ok);
  return ok;
}

async function submitBooking() {
  if (!selectedDate || !selectedTime) { toast('Select a date and time.', 'error'); return; }
  let ok = true;
  ok &= vF('bk_name','be_name', v => v.trim().length > 1);
  ok &= vF('bk_phone','be_phone', v => /^[+0-9\s\-]{7,}$/.test(v));
  if (!ok) return;
  const btn = document.getElementById('bkSubmitBtn');
  document.getElementById('bkSubmitTxt').textContent = 'Checking…';
  document.getElementById('bkSpinner').style.display = 'block';
  document.getElementById('bkSubmitIcon').style.display = 'none';
  btn.disabled = true;
  try {
    const existing = await sbGet('bookings', `select=id&doctor_id=eq.${currentDoc.id}&preferred_date=eq.${selectedDate}&preferred_time=eq.${selectedTime}&status=neq.cancelled`);
    if (existing.length > 0) {
      toast('This slot was just booked. Please select another time.', 'error');
      document.getElementById('bkSubmitTxt').textContent = 'Confirm Booking';
      document.getElementById('bkSpinner').style.display = 'none';
      document.getElementById('bkSubmitIcon').style.display = 'block';
      btn.disabled = false;
      const dayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(selectedDate + 'T00:00:00').getDay()];
      selectDate(selectedDate, dayName, document.querySelector('.date-btn.selected'));
      return;
    }
    const data = {
      doctor_id: currentDoc.id, doctor_name: currentDoc.full_name, docube_center: currentDoc.docube_center,
      patient_name: document.getElementById('bk_name').value.trim(),
      patient_phone: document.getElementById('bk_phone').value.trim(),
      patient_email: document.getElementById('bk_email').value.trim(),
      patient_age: document.getElementById('bk_age').value.trim(),
      patient_gender: document.querySelector('input[name="gender"]:checked')?.value,
      preferred_date: selectedDate, preferred_time: selectedTime,
      reason: document.getElementById('bk_reason').value.trim(),
      status: 'pending'
    };
    await sbPost('bookings', data);
    const d = new Date(selectedDate + 'T00:00:00');
    document.getElementById('bkSuccessMsg').innerHTML = `Your consultation with <strong>${currentDoc.full_name}</strong> on <strong>${d.toLocaleDateString('en-IN',{day:'numeric',month:'long'})} at ${formatTime(selectedTime)}</strong> is requested. The Docube team will call you within 2 hours to confirm.`;
    document.getElementById('bkSuccess').classList.add('show');
    document.getElementById('bkSuccess').scrollIntoView({ behavior: 'smooth' });
    ['slotCard','patientCard'].forEach(id => document.getElementById(id).style.display = 'none');
  } catch(e) {
    toast('Booking failed. Try again.', 'error');
    document.getElementById('bkSubmitTxt').textContent = 'Confirm Booking';
    document.getElementById('bkSpinner').style.display = 'none';
    document.getElementById('bkSubmitIcon').style.display = 'block';
    btn.disabled = false;
  }
}

loadBooking();
</script>
</body>
</html>
