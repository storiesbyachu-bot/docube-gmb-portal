<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docube — Find a Doctor</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.dl-hero{background:var(--navy);padding:44px 20px;position:relative;overflow:hidden}
.dl-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 100% at 60% -20%,rgba(77,217,217,.15) 0%,transparent 55%)}
.dl-hero-inner{position:relative;z-index:1;max-width:900px;margin:0 auto}
.dl-hero h1{font-family:'Instrument Serif',serif;font-size:clamp(26px,4vw,40px);color:#fff;margin-bottom:8px}
.dl-hero p{font-size:14px;color:rgba(255,255,255,.5);font-weight:300}
.dl-search-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.dl-search-row input{flex:1;min-width:200px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);color:#fff;border-radius:var(--r-sm);padding:10px 16px;font-family:inherit;font-size:13.5px;outline:none}
.dl-search-row input::placeholder{color:rgba(255,255,255,.35)}
.dl-search-row input:focus{border-color:var(--teal);background:rgba(255,255,255,.1)}
.dl-date-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.dl-date-row label{font-size:12.5px;color:rgba(255,255,255,.6);font-weight:500;white-space:nowrap}
.dl-date-row input[type=date]{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);color:#fff;border-radius:var(--r-sm);padding:8px 14px;font-family:inherit;font-size:13px;outline:none;color-scheme:dark}
.dl-date-row input[type=date]:focus{border-color:var(--teal)}
.dl-date-clear{font-size:12px;color:rgba(255,255,255,.45);cursor:pointer;text-decoration:underline}
.dl-date-clear:hover{color:var(--teal)}
.dl-body{max-width:900px;margin:0 auto;padding:22px 20px 80px}
.dl-filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filter-btn{padding:6px 14px;border-radius:20px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-mid);transition:all .16s}
.filter-btn.on{background:var(--teal-pale);border-color:var(--teal-dark);color:var(--navy)}
.dl-grid{display:flex;flex-direction:column;gap:14px}
.dl-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow-sm);text-decoration:none;display:block;color:inherit;transition:all .2s}
.dl-card:hover{box-shadow:var(--shadow);border-color:var(--teal);transform:translateY(-1px)}
.dl-card-inner{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:start}
@media(max-width:600px){.dl-card-inner{grid-template-columns:48px 1fr}}
.dl-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--teal-pale),rgba(77,217,217,.3));border:2.5px solid var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:22px;color:var(--navy);flex-shrink:0}
.dl-info{min-width:0}
.dl-name{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:2px}
.dl-spec{font-size:13px;color:var(--teal-dark);font-weight:600;margin-bottom:10px}
.dl-meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 20px;margin-bottom:10px}
.dl-meta-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-mid)}
.dl-meta-item svg{width:13px;height:13px;color:var(--teal-dark);flex-shrink:0}
.dl-meta-item strong{color:var(--text);font-weight:600}
.dl-centers{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dl-center-tag{font-size:11.5px;background:var(--teal-pale);border:1px solid var(--border);color:var(--text-mid);padding:3px 10px;border-radius:20px;font-weight:500}
.dl-card-action{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;padding-top:2px}
@media(max-width:600px){.dl-card-action{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;border-top:1px solid var(--border-light);padding-top:12px;margin-top:4px}}
.dl-slots{text-align:right}
.dl-slots-count{font-size:18px;font-weight:800;color:var(--navy);line-height:1}
.dl-slots-label{font-size:11px;color:var(--text-muted);margin-top:2px}
.dl-slots.available .dl-slots-count{color:#1a9f7e}
.dl-slots.unavailable .dl-slots-count{color:var(--error)}
.dl-slots.loading .dl-slots-count{font-size:13px;color:var(--text-muted)}
.dl-book-btn{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;padding:9px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:700;white-space:nowrap;transition:all .16s}
.dl-card:hover .dl-book-btn{background:var(--orange-dark)}
.empty-state{text-align:center;padding:56px 20px;color:var(--text-muted)}
.loader-wrap{text-align:center;padding:56px 20px}
.loader{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg">Done</span>
</div>

<nav class="topnav">
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 44 22" fill="none">
      <polyline points="0,11 5,11 7.5,4 10,18 12.5,7 15,14 18,11 22,11" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="25" y1="3" x2="25" y2="19" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="29" y1="1" x2="29" y2="21" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="33" y1="4" x2="33" y2="18" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="37" y1="7" x2="37" y2="15" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="41" y1="9" x2="41" y2="13" stroke="#4DD9D9" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="nav-logo-text"><b>DOC</b>UBE</span>
  </a>
  <div class="nav-spacer"></div>
  <a class="nav-btn nav-btn-ghost" href="index.html">Our Doctors</a>
  <a class="nav-btn nav-btn-admin" href="admin.html">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Admin
  </a>
  <a class="nav-btn nav-btn-orange" href="onboard.html">GMB Onboarding</a>
</nav>

<div class="dl-hero">
  <div class="dl-hero-inner">
    <h1>Find Your <i style="font-style:italic;color:var(--teal)">Specialist</i></h1>
    <p>Book a private consultation with Bangalore's top doctors at Docube centers</p>
    <div class="dl-search-row">
      <input type="text" id="searchInput" placeholder="Search by name, speciality or center…" oninput="filterDoctors()">
    </div>
    <div class="dl-date-row">
      <label>Check availability for:</label>
      <input type="date" id="slotDate" onchange="filterDoctors()">
      <span class="dl-date-clear" onclick="clearDate()">Show all</span>
    </div>
  </div>
</div>

<div class="dl-body fadein">
  <div class="dl-filter-bar" id="centerFilters"></div>
  <div class="dl-grid" id="doctorGrid">
    <div class="loader-wrap"><div class="loader"></div><p style="color:var(--text-muted)">Loading doctors…</p></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let allDoctors = [];
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Set date picker default to today
const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('slotDate').value = todayStr;
document.getElementById('slotDate').min = todayStr;

async function loadDoctors() {
  const grid = document.getElementById('doctorGrid');
  try {
    allDoctors = await sbGet('doctor_profiles',
      'select=id,full_name,speciality,experience,gmb_status,docube_center,docube_centers,languages,appointment_type,fee_range,consultation_hours&order=created_at.desc');
    buildCenterFilters();
    filterDoctors();
  } catch(e) {
    console.error('Load doctors error:', e.message);
    grid.innerHTML = `<div class="empty-state">Could not load doctors: ${e.message.slice(0,120)}</div>`;
  }
}

function buildCenterFilters() {
  const tryParse = (val, fb) => { if (!val) return fb; if (typeof val === 'object') return val; try { return JSON.parse(val); } catch(e) { return fb; } };
  const allCenters = allDoctors.flatMap(d => tryParse(d.docube_centers, d.docube_center ? [d.docube_center] : []));
  const centers = ['All', ...new Set(allCenters.filter(Boolean).map(c => c.replace('Docube Healthcare – ','')))];
  document.getElementById('centerFilters').innerHTML = centers.map((c,i) =>
    `<button class="filter-btn${i===0?' on':''}" onclick="filterByCenter('${c}',this)">${c}</button>`).join('');
}

let activeCenter = 'All';
function filterByCenter(center, btn) {
  activeCenter = center;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filterDoctors();
}

function clearDate() {
  document.getElementById('slotDate').value = todayStr;
  filterDoctors();
}

function filterDoctors() {
  const tryParse = (val, fb) => { if (!val) return fb; if (typeof val === 'object') return val; try { return JSON.parse(val); } catch(e) { return fb; } };
  const q = document.getElementById('searchInput').value.toLowerCase();
  let docs = allDoctors;
  if (activeCenter !== 'All') docs = docs.filter(d => {
    const centers = tryParse(d.docube_centers, d.docube_center ? [d.docube_center] : []);
    return centers.some(c => c.includes(activeCenter));
  });
  if (q) docs = docs.filter(d =>
    (d.full_name||'').toLowerCase().includes(q) ||
    (d.speciality||'').toLowerCase().includes(q) ||
    (d.docube_center||'').toLowerCase().includes(q)
  );
  renderDoctors(docs);
}

async function renderDoctors(docs) {
  const grid = document.getElementById('doctorGrid');
  if (!docs.length) { grid.innerHTML = '<div class="empty-state"><p>No doctors found.</p></div>'; return; }
  const tryParse = (val, fb) => { if (!val) return fb; if (typeof val === 'object') return val; try { return JSON.parse(val); } catch(e) { return fb; } };
  const selectedDate = document.getElementById('slotDate').value;
  const dayName = selectedDate ? DAY_NAMES[new Date(selectedDate + 'T00:00:00').getDay()] : null;

  // Render cards immediately with loading state for slots
  grid.innerHTML = docs.map(d => {
    const langs = tryParse(d.languages, []);
    const centers = tryParse(d.docube_centers, d.docube_center ? [d.docube_center] : []);
    const hours = tryParse(d.consultation_hours, []);

    // Check if doctor works on selected day
    const dayHours = dayName ? hours.find(h => h.day === dayName) : null;
    const isClosedToday = dayHours ? dayHours.closed : false;

    // Generate total slots for the day
    const totalSlots = (!isClosedToday && dayHours) ? genSlots(dayHours.open, dayHours.close).length : 0;

    // Appointment type — expand "Both" to full words
    const apptDisplay = {
      'Walk-in': 'Walk-in',
      'Appointment Only': 'Appointment Only',
      'Both': 'Walk-in & Appointment'
    }[d.appointment_type] || d.appointment_type || '';

    const centerTags = centers.map(c => `<span class="dl-center-tag">${c.replace('Docube Healthcare – ','')}</span>`).join('');
    const dateLabel = selectedDate ? new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'}) : 'Today';

    return `<a class="dl-card" href="profile.html?doctor=${d.id}">
      <div class="dl-card-inner">
        <div class="dl-avatar">${initials(d.full_name)}</div>
        <div class="dl-info">
          <div class="dl-name">${d.full_name}</div>
          <div class="dl-spec">${d.speciality}</div>
          <div class="dl-meta-grid">
            <div class="dl-meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span><strong>${d.experience}</strong> experience</span>
            </div>
            ${apptDisplay ? `<div class="dl-meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span><strong>${apptDisplay}</strong></span>
            </div>` : ''}
            ${d.fee_range ? `<div class="dl-meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              <span><strong>${d.fee_range}</strong></span>
            </div>` : ''}
            ${langs.length ? `<div class="dl-meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span><strong>${langs.join(', ')}</strong></span>
            </div>` : ''}
          </div>
          <div class="dl-centers">${centerTags}</div>
        </div>
        <div class="dl-card-action">
          <div class="dl-slots ${isClosedToday ? 'unavailable' : totalSlots > 0 ? 'available' : 'loading'}" id="slots-${d.id}">
            <div class="dl-slots-count">${isClosedToday ? '—' : totalSlots > 0 ? totalSlots : '...'}</div>
            <div class="dl-slots-label">${isClosedToday ? 'Closed' : 'slots'}<br><span style="font-size:10px;opacity:.7">${dateLabel}</span></div>
          </div>
          <div class="dl-book-btn">
            Book
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="13" height="13"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
      </div>
    </a>`;
  }).join('');

  // Now fetch booked slots asynchronously and update available count
  if (selectedDate) {
    docs.forEach(async d => {
      const hours = tryParse(d.consultation_hours, []);
      const dayHours = hours.find(h => h.day === dayName);
      if (!dayHours || dayHours.closed) return;
      const totalSlots = genSlots(dayHours.open, dayHours.close).length;
      try {
        const booked = await sbGet('bookings', `select=preferred_time&doctor_id=eq.${d.id}&preferred_date=eq.${selectedDate}&status=neq.cancelled`);
        const available = totalSlots - booked.length;
        const el = document.getElementById(`slots-${d.id}`);
        if (!el) return;
        el.className = `dl-slots ${available > 0 ? 'available' : 'unavailable'}`;
        el.innerHTML = `<div class="dl-slots-count">${available > 0 ? available : 'Full'}</div>
          <div class="dl-slots-label">${available > 0 ? 'slots free' : 'no slots'}<br><span style="font-size:10px;opacity:.7">${new Date(selectedDate+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</span></div>`;
      } catch(e) {}
    });
  }
}

function genSlots(open, close) {
  const s = []; let [oh, om] = open.split(':').map(Number);
  const [ch, cm] = close.split(':').map(Number);
  const cMin = ch * 60 + cm;
  while (oh * 60 + om < cMin) {
    s.push(`${String(oh).padStart(2,'0')}:${String(om).padStart(2,'0')}`);
    om += 30; if (om >= 60) { oh++; om -= 60; }
  }
  return s;
}

loadDoctors();
</script>
</body>
</html>
